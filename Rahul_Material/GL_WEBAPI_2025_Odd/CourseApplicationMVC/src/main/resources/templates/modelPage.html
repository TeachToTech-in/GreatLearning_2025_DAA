<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add / Edit Courses</title>
    <style>
        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #f9f9f9;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <form th:action="@{/course/save}" th:object="${course}" method="post">
        <h2 th:text="${#fields.hasErrors()} ? 'Edit Course' : 'Add Course'">  Add | Update Course </h2>


        <input type="hidden" id="id" th:field="*{courseid}" 
               placeholder="Auto-generated or uneditable for new students"/>

        <label for="name">Course Name</label>
        <input type="text" id="name" th:field="*{coursename}" placeholder="Enter Course Name" required />

        <label for="contact">Course Author</label>
        <input type="text" id="contact" th:field="*{courseauthor}" placeholder="Enter Course Author" required />

        <button type="submit">Submit</button>
    </form>
</body>
</html>
