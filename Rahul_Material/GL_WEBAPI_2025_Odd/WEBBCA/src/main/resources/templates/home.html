<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .btn {
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .btn-add {
            background-color: #27ae60;
        }
        .btn-update {
            background-color: #2980b9;
        }
        .btn-delete {
            background-color: #c0392b;
        }
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .top-bar {
            text-align: right;
            width: 80%;
            margin: auto;
        }
    </style>
</head>
<body>

    <h1>All Students</h1>

    <div class="top-bar">
        <a class="btn btn-add" th:href="@{/students/add}">+ Add Student</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.contact}"></td>
                <td>
                    <a class="btn btn-update" th:href="@{'/students/edit/' + ${student.id}}">Update</a>
                    <a class="btn btn-delete" th:href="@{'/students/delete/' + ${student.id}}" 
                       onclick="return confirm('Are you sure you want to delete this student?');">
                       Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <footer style="text-align:center; margin-top:40px; color:#888;">
        <p>&copy; 2025 Student Management System</p>
    </footer>

</body>
</html>
